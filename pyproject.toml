[project]
name = "pixelproof"
version = "0.3.0"
description = "PixelProof - AI Image Detection Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "grad-cam>=1.5.0",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.8.0",
]

[tool.vercel]
entrypoint = "src.api:app"
