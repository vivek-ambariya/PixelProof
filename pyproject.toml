[project]
name = "pixelproof"
version = "0.3.0"
description = "PixelProof - AI Image Detection Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "python-multipart>=0.0.32",
    "pillow>=12.1.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.14.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "grad-cam>=1.5.0",
    "albumentations>=2.0.0",
    "opencv-python-headless>=5.0.0",
]

[tool.vercel]
entrypoint = "src.api:app"
